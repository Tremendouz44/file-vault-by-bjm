<!doctype html>
<!--
  File Vault by BJM – https://filevault.stading.sk
  Author: Branislav Jozef Murcin
  The download page itself lives in https://github.com/tremendouz44/Better-Explorer (d.html). Trimble Connect only
  answers it on github.io, so this page shows it full-screen and keeps this address; it also saves the files for it
  (the "Save as" window and downloads), because a framed page may not do that itself.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="origin">
<title>File Vault by BJM</title>
<style>
  html, body { margin: 0; height: 100%; background: #f1f1f6; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="app" title="File Vault by BJM"></iframe>
<script>
"use strict";
const APP = "https://tremendouz44.github.io/Better-Explorer/d.html";
const APP_ORIGIN = new URL(APP).origin;
const frame = document.getElementById("app");
frame.src = APP + "?embed=1&t=" + Date.now() + location.hash;   // always the newest page (no stale browser copy); after # stays in the browser
window.addEventListener("hashchange", () => location.reload());

let handle = null;
const reply = (id, data) => frame.contentWindow.postMessage({ ...data, id }, APP_ORIGIN);
function download(href, name) {
  const a = document.createElement("a");
  a.href = href; if (name) a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
window.addEventListener("message", async e => {
  if (e.origin !== APP_ORIGIN || e.source !== frame.contentWindow) return;
  const m = e.data || {};
  if (m.type === "fv-title") document.title = String(m.title || "File Vault by BJM");
  else if (m.type === "fv-pick") {                       // the "Save as" window, starting in Downloads
    let res = "na";
    if (typeof window.showSaveFilePicker === "function") {
      try {
        handle = await window.showSaveFilePicker({ suggestedName: m.name, startIn: "downloads",
          ...(m.zip ? { types: [{ description: "ZIP archive", accept: { "application/zip": [".zip"] } }] } : {}) });
        res = "ok";
      } catch (err) { handle = null; res = err && err.name === "AbortError" ? "cancel" : "na"; }
    }
    reply(m.id, { res });
  } else if (m.type === "fv-write") {                    // the file chosen in the window gets the data
    let ok = false;
    try { const w = await handle.createWritable(); await w.write(m.blob); await w.close(); ok = true; } catch { /* reported below */ }
    handle = null;
    reply(m.id, { ok });
  } else if (m.type === "fv-download") {                 // browsers without the window: a normal download
    if (m.blob) { const url = URL.createObjectURL(m.blob); download(url, m.name); setTimeout(() => URL.revokeObjectURL(url), 120000); }
    else if (/^https:\/\//.test(m.href || "")) download(m.href, m.name);
  }
});
</script>
</body>
</html>
